name: Phase 0 CORDIC gates
on:
  push:
    branches: [main, "feat/**"]
  pull_request:

jobs:
  phase0:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install simulation and synthesis tools
        run: |
          sudo apt-get update
          sudo apt-get install -y verilator yosys z3 git make
      - name: Install SymbiYosys
        run: |
          python -m pip install click
          git clone --depth 1 https://github.com/YosysHQ/sby.git /tmp/sby
          make -C /tmp/sby install PREFIX="$HOME/.local"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Run Python unit tests
        run: python -m unittest discover -s tests -v
      - name: Validate task catalog, CORDIC architecture space and multiplier evidence gates
        run: |
          python -m chiprd.cli task-validate
          python -m chiprd.cli architecture-generate --check-generated
          python -m chiprd.cli architecture-space-validate
          python -m chiprd.cli multiplier-eval --output artifacts/multiplier/functional
          python -m chiprd.cli multiplier-formal --output artifacts/multiplier/formal
          python -m chiprd.cli multiplier-mutation --audit-vectors 128 --output artifacts/multiplier/mutation
      # Experimental architecture proofs must not block the independent CORDIC gates.
      - name: Evaluate all multiplier architecture candidates
        continue-on-error: true
        run: |
          # Run every candidate even when one functional/formal gate fails.
          set +e
          for entry in \
            "inferred_multiply tasks/multiplier/int_mul16.sv" \
            "split8x8_linear tasks/multiplier/architectures/split8x8_linear.sv" \
            "split8x8_tree tasks/multiplier/architectures/split8x8_tree.sv"; do
            read -r id rtl <<< "$entry"
            python -m chiprd.cli multiplier-eval \
              --candidate "$rtl" --seed 20261116 \
              --output "artifacts/multiplier-sweep/$id/functional"
            python -m chiprd.cli multiplier-formal \
              --candidate "$rtl" \
              --output "artifacts/multiplier-sweep/$id/formal"
          done
      - name: Verify and synthesize CORDIC candidate
        run: |
          python -m chiprd.cli all --candidate tasks/cordic/cordic_rotator.sv --output artifacts/ci
      - name: Run simulation mutation sensitivity campaign
        run: |
          python -m chiprd.cli mutation --candidate tasks/cordic/cordic_rotator.sv --output artifacts/mutation
      - name: Prove CORDIC protocol properties
        run: |
          python -m chiprd.cli formal --candidate tasks/cordic/cordic_rotator.sv --output artifacts/formal
      - name: Run formal negative control
        run: |
          python -m chiprd.cli formal-negative-control --candidate tasks/cordic/cordic_rotator.sv --output artifacts/formal-negative-control
      - name: Upload evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase0-evidence
          path: |
            artifacts/ci/
            artifacts/multiplier/
            artifacts/mutation/
            artifacts/formal/
            artifacts/formal-negative-control/
            artifacts/multiplier-sweep/
            artifacts/agent-ppa-campaigns/
          if-no-files-found: warn

  reproducible-experiment:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install Verilator
        run: |
          sudo apt-get update
          sudo apt-get install -y verilator
      - name: Download pinned OSS CAD Suite (EQY/Yosys/SBY/Z3 toolchain)
        run: |
          archive="$RUNNER_TEMP/oss-cad-suite.tgz"
          curl -L --fail --retry 3 \
            https://github.com/YosysHQ/oss-cad-suite-build/releases/download/2026-11-12/oss-cad-suite-linux-x64-20261112.tgz \
            -o "$archive"
          echo "346499255e3e5e6e9bf67e1d378a4e6bc249abd3de3b0caf5b57604bc8ba1752  $archive" | sha256sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP"
      - name: Run sealed end-to-end experiment
        shell: bash
        run: |
          source "$RUNNER_TEMP/oss-cad-suite/environment"
          verilator --version
          yosys -V
          eqy --version
          sby --version
          z3 --version
          python3 -m chiprd.cli experiment \
            --candidate tasks/cordic/cordic_rotator.sv \
            --output artifacts/experiment
      - name: Evaluate generated 2x and 4x CORDIC microarchitectures independently
        shell: bash
        run: |
          source "$RUNNER_TEMP/oss-cad-suite/environment"
          python3 -m chiprd.cli architecture-generate --check-generated
          python3 -m chiprd.cli architecture-space-validate

          # Do not let one inconclusive candidate suppress evidence for the other.
          set +e
          python3 -m chiprd.cli experiment \
            --candidate tasks/cordic/generated/cordic_iter2.sv \
            --output artifacts/architecture/iter2 --seed 20261117
          iter2_rc=$?
          echo "CORDIC iter2 experiment exit code: $iter2_rc"

          python3 -m chiprd.cli experiment \
            --candidate tasks/cordic/generated/cordic_iter4.sv \
            --output artifacts/architecture/iter4 --seed 20261117
          iter4_rc=$?
          echo "CORDIC iter4 experiment exit code: $iter4_rc"

          # Both reports have now been produced. Preserve strict gating.
          if [ "$iter2_rc" -ne 0 ] || [ "$iter4_rc" -ne 0 ]; then
            echo "::error::At least one generated CORDIC architecture did not pass all experiment gates (iter2=$iter2_rc, iter4=$iter4_rc)."
            exit 1
          fi
      - name: Reproduce experiment from its manifest
        shell: bash
        run: |
          source "$RUNNER_TEMP/oss-cad-suite/environment"
          python3 -m chiprd.cli reproduce \
            --manifest artifacts/experiment/experiment_manifest.json \
            --output artifacts/reproduced
      - name: Run evolutionary candidate search under a fixed budget
        shell: bash
        run: |
          source "$RUNNER_TEMP/oss-cad-suite/environment"
          python3 -m chiprd.cli search \
            --proposals examples/search/cordic_candidate_pool.json \
            --strategy evolutionary \
            --max-experiments 2 \
            --max-wall-clock-seconds 1200 \
            --max-experiment-seconds 600 \
            --output artifacts/search \
            --seed 20261113
      - name: Run repeated Agent campaign with deterministic fixture
        shell: bash
        run: |
          source "$RUNNER_TEMP/oss-cad-suite/environment"
          python3 -m chiprd.cli agent-campaign \
            --agent-command-json '["python3","examples/agents/mock_agent.py"]' \
            --runs 2 \
            --max-iterations 1 \
            --max-wall-clock-seconds 1800 \
            --max-agent-seconds 60 \
            --max-experiment-seconds 600 \
            --output artifacts/agent-campaigns/ci \
            --campaign-id ci-agent-campaign \
            --seed 20261113
      - name: Post-selection numerical audit with independent seed
        shell: bash
        run: |
          source "$RUNNER_TEMP/oss-cad-suite/environment"
          python3 -m chiprd.cli audit \
            --loop-report artifacts/agent-campaigns/ci/runs/run-001/agent_loop_report.json \
            --audit-seed 991977 \
            --audit-vectors 128 \
            --output artifacts/post-selection-audit
      - name: Upload sealed experiment, reproduction, search and patch evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reproducible-experiment-evidence
          path: |
            artifacts/experiment/
            artifacts/architecture/
            artifacts/reproduced/
            artifacts/search/
            artifacts/agent-patches/
            artifacts/agent-patch-experiment/
            artifacts/agent-loops/
            artifacts/agent-campaigns/
            artifacts/post-selection-audit/
          if-no-files-found: warn

  liberty-mapping:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Verilator for sealed Agent experiments
        run: |
          sudo apt-get update
          sudo apt-get install -y verilator
      - name: Download pinned OSS CAD Suite
        run: |
          archive="$RUNNER_TEMP/oss-cad-suite.tgz"
          curl -L --fail --retry 3 \
            https://github.com/YosysHQ/oss-cad-suite-build/releases/download/2026-11-12/oss-cad-suite-linux-x64-20261112.tgz \
            -o "$archive"
          echo "346499255e3e5e6e9bf67e1d378a4e6bc249abd3de3b0caf5b57604bc8ba1752  $archive" | sha256sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP"
      - name: Download pinned Nangate45 reference Liberty
        shell: bash
        run: |
          liberty="$RUNNER_TEMP/NangateOpenCellLibrary_typical.lib"
          curl -L --fail --retry 3 \
            https://raw.githubusercontent.com/The-OpenROAD-Project/OpenROAD-flow-scripts/23341145f0fc92a522de26d5244a4a0013818f97/flow/platforms/nangate45/lib/NangateOpenCellLibrary_typical.lib \
            -o "$liberty"
          test "$(git hash-object "$liberty")" = "90e4afb274cfc6514c587c434c77903d554117d1"
      - name: Compare Liberty-mapped standard-cell area
        shell: bash
        run: |
          source "$RUNNER_TEMP/oss-cad-suite/environment"
          python3 -m chiprd.cli ppa \
            --candidate tasks/cordic/cordic_rotator_refactor.sv \
            --reference tasks/cordic/cordic_rotator.sv \
            --liberty "$RUNNER_TEMP/NangateOpenCellLibrary_typical.lib" \
            --platform-label nangate45-reference \
            --output artifacts/ppa/nangate45
      - name: Map experimental signed multiplier to Nangate45
        shell: bash
        run: |
          source "$RUNNER_TEMP/oss-cad-suite/environment"
          python3 -m chiprd.cli ppa \
            --candidate tasks/multiplier/int_mul16.sv \
            --no-reference \
            --top-module int_mul16 \
            --liberty "$RUNNER_TEMP/NangateOpenCellLibrary_typical.lib" \
            --platform-label nangate45-reference \
            --output artifacts/ppa/nangate45-multiplier
      - name: Install standalone OpenROAD STA engine
        shell: bash
        run: |
          deb="$RUNNER_TEMP/openroad.deb"
          curl -L --fail --retry 3 \
            https://github.com/Precision-Innovations/OpenROAD/releases/download/2024-12-14/openroad_2.0-17598-ga008522d8_amd64-ubuntu-22.04.deb \
            -o "$deb"
          echo "40ed178396b0276a5d5dfbbe695c9de9aac9088157a6655be02b39a0cef07207  $deb" | sha256sum -c -
          sudo apt-get update
          sudo apt-get install -y "$deb"
          openroad -version
      - name: Download pinned Nangate45 technology and cell LEFs
        shell: bash
        run: |
          for entry in \
            "NangateOpenCellLibrary.tech.lef db9ccc17e72a9f574264928dce8c89eda6c79f98" \
            "NangateOpenCellLibrary.macro.lef afba6cdd9215a5ac3bd3b5228cbdee58023177f0"; do
            set -- $entry
            curl -L --fail --retry 3 \
              "https://raw.githubusercontent.com/The-OpenROAD-Project/OpenROAD-flow-scripts/23341145f0fc92a522de26d5244a4a0013818f97/flow/platforms/nangate45/lef/$1" \
              -o "$RUNNER_TEMP/$1"
            test "$(git hash-object "$RUNNER_TEMP/$1")" = "$2"
          done
      - name: Compare pre-layout SDC-constrained timing
        shell: bash
        run: |
          source "$RUNNER_TEMP/oss-cad-suite/environment"
          openroad -version
          python3 -m chiprd.cli timing \
            --candidate tasks/cordic/cordic_rotator_refactor.sv \
            --reference tasks/cordic/cordic_rotator.sv \
            --liberty "$RUNNER_TEMP/NangateOpenCellLibrary_typical.lib" \
            --tech-lef "$RUNNER_TEMP/NangateOpenCellLibrary.tech.lef" \
            --cells-lef "$RUNNER_TEMP/NangateOpenCellLibrary.macro.lef" \
            --clock-period-ns 10 \
            --io-delay-ns 0.5 \
            --output artifacts/timing/nangate45
      - name: Score timing-feasible mapped-area experiment
        shell: bash
        run: |
          python3 -m chiprd.ppa_scorecard \
            artifacts/timing/nangate45/timing_report.json \
            --output artifacts/timing/nangate45/ppa_scorecard.json
      - name: Analyze signed multiplier input-to-output timing (clockless)
        shell: bash
        run: |
          source "$RUNNER_TEMP/oss-cad-suite/environment"
          python3 -m chiprd.cli comb-timing \
            --candidate tasks/multiplier/int_mul16.sv \
            --top-module int_mul16 \
            --input-ports a,b \
            --output-ports product \
            --liberty "$RUNNER_TEMP/NangateOpenCellLibrary_typical.lib" \
            --tech-lef "$RUNNER_TEMP/NangateOpenCellLibrary.tech.lef" \
            --cells-lef "$RUNNER_TEMP/NangateOpenCellLibrary.macro.lef" \
            --max-delay-ns 10 \
            --input-transition-ns 0.05 \
            --output-load-pf 0.002 \
            --platform-label nangate45-reference \
            --output artifacts/timing/nangate45-multiplier
      - name: Map and time all multiplier architecture candidates
        shell: bash
        run: |
          source "$RUNNER_TEMP/oss-cad-suite/environment"
          for entry in \
            "inferred_multiply tasks/multiplier/int_mul16.sv" \
            "split8x8_linear tasks/multiplier/architectures/split8x8_linear.sv" \
            "split8x8_tree tasks/multiplier/architectures/split8x8_tree.sv"; do
            read -r id rtl <<< "$entry"
            python3 -m chiprd.cli ppa \
              --candidate "$rtl" --no-reference --top-module int_mul16 \
              --liberty "$RUNNER_TEMP/NangateOpenCellLibrary_typical.lib" \
              --platform-label nangate45-reference \
              --output "artifacts/multiplier-sweep/$id/ppa"
            python3 -m chiprd.cli comb-timing \
              --candidate "$rtl" --top-module int_mul16 \
              --input-ports a,b --output-ports product \
              --liberty "$RUNNER_TEMP/NangateOpenCellLibrary_typical.lib" \
              --tech-lef "$RUNNER_TEMP/NangateOpenCellLibrary.tech.lef" \
              --cells-lef "$RUNNER_TEMP/NangateOpenCellLibrary.macro.lef" \
              --max-delay-ns 10 --input-transition-ns 0.05 --output-load-pf 0.002 \
              --platform-label nangate45-reference \
              --output "artifacts/multiplier-sweep/$id/timing"
          done
      - name: Run deterministic multi-round PPA-aware Agent campaign
        shell: bash
        run: |
          source "$RUNNER_TEMP/oss-cad-suite/environment"
          python3 -m chiprd.cli ppa-campaign \
            --agent-command-json '["python3","examples/agents/multi_round_mock_agent.py"]' \
            --liberty "$RUNNER_TEMP/NangateOpenCellLibrary_typical.lib" \
            --tech-lef "$RUNNER_TEMP/NangateOpenCellLibrary.tech.lef" \
            --cells-lef "$RUNNER_TEMP/NangateOpenCellLibrary.macro.lef" \
            --runs 2 --max-iterations 3 \
            --max-wall-clock-seconds 3600 --max-agent-seconds 60 \
            --max-experiment-seconds 600 \
            --output artifacts/agent-ppa-campaigns/ci \
            --campaign-id phase30-ci --seed 20261116
      - name: Independently audit every selected Agent candidate
        shell: bash
        run: |
          source "$RUNNER_TEMP/oss-cad-suite/environment"
          python3 -m chiprd.cli ppa-campaign-audit \
            --campaign-dir artifacts/agent-ppa-campaigns/ci \
            --audit-seed 991977 --audit-vectors 128
      - name: Upload Liberty mapping evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: liberty-mapping-evidence
          path: |
            artifacts/ppa/
            artifacts/timing/
            artifacts/multiplier-sweep/
          if-no-files-found: warn

  multiplier-evidence-manifest:
    needs: [phase0, liberty-mapping]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Download functional, formal and mutation evidence
        uses: actions/download-artifact@v4
        with:
          name: phase0-evidence
          path: artifacts/input/phase0
      - name: Download Liberty mapping and combinational timing evidence
        uses: actions/download-artifact@v4
        with:
          name: liberty-mapping-evidence
          path: artifacts/input/liberty
      - name: Build and independently verify multiplier evidence manifest
        run: |
          python3 -m chiprd.multiplier_evidence build \
            --candidate tasks/multiplier/int_mul16.sv \
            --functional-report artifacts/input/phase0/multiplier/functional/report.json \
            --formal-report artifacts/input/phase0/multiplier/formal/equivalence_report.json \
            --mutation-report artifacts/input/phase0/multiplier/mutation/mutation_report.json \
            --ppa-report artifacts/input/liberty/ppa/nangate45-multiplier/ppa_report.json \
            --timing-report artifacts/input/liberty/timing/nangate45-multiplier/combinational_timing_report.json \
            --output artifacts/multiplier-evidence
          python3 -m chiprd.multiplier_evidence verify \
            --manifest artifacts/multiplier-evidence/multiplier_evidence_manifest.json
      - name: Upload unified multiplier evidence manifest
        uses: actions/upload-artifact@v4
        with:
          name: multiplier-evidence-manifest
          path: artifacts/multiplier-evidence/
          if-no-files-found: error

  # Keep inconclusive experimental multiplier proofs visible without failing Phase 0.
  multiplier-architecture-comparison:
    continue-on-error: true
    needs: [phase0, liberty-mapping]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Download functional and formal architecture evidence
        uses: actions/download-artifact@v4
        with:
          name: phase0-evidence
          path: artifacts/input/phase0
      - name: Download mapped PPA and timing architecture evidence
        uses: actions/download-artifact@v4
        with:
          name: liberty-mapping-evidence
          path: artifacts/input/liberty
      - name: Assemble architecture evidence and compare Pareto frontier
        run: |
          mkdir -p artifacts/multiplier-sweep
          cp -a artifacts/input/phase0/multiplier-sweep/. artifacts/multiplier-sweep/
          cp -a artifacts/input/liberty/multiplier-sweep/. artifacts/multiplier-sweep/
          python3 -m chiprd.multiplier_sweep \
            --catalog tasks/multiplier/architectures.json \
            --evidence-root artifacts/multiplier-sweep \
            --output artifacts/multiplier-sweep-summary
      - name: Upload architecture comparison and all candidate evidence
        uses: actions/upload-artifact@v4
        with:
          name: multiplier-architecture-comparison
          path: |
            artifacts/multiplier-sweep/
            artifacts/multiplier-sweep-summary/
          if-no-files-found: error
