name: Phase 0 CORDIC gates
on:
  push:
    branches: [main, "feat/**"]
  pull_request:

jobs:
  phase0:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install open-source EDA tools
        run: |
          sudo apt-get update
          sudo apt-get install -y verilator yosys
      - name: Run Python unit tests
        run: python -m unittest discover -s tests -v
      - name: Verify and synthesize CORDIC candidate
        run: |
          python -m chiprd.cli all --candidate tasks/cordic/cordic_rotator.sv --output artifacts/ci
      - name: Upload evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase0-evidence
          path: artifacts/ci/
          if-no-files-found: warn
